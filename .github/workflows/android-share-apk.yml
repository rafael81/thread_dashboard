name: Android share APK

on:
  workflow_dispatch:
  push:
    paths:
      - "thread-android-share/**"
      - ".github/workflows/android-share-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test and build both debug APKs
        run: >-
          gradle -p thread-android-share
          :app:testDashboardDebugUnitTest
          :app:testAutoscheduleDebugUnitTest
          :app:assembleDashboardDebug
          :app:assembleAutoscheduleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: threads-share-android-v0.7.0
          path: |
            thread-android-share/app/build/outputs/apk/dashboard/debug/app-dashboard-debug.apk
            thread-android-share/app/build/outputs/apk/autoschedule/debug/app-autoschedule-debug.apk
          if-no-files-found: error
